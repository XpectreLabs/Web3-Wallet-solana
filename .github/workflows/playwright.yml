name: Playwright Tests

on:
  push:
    branches: [main, Dev]
  pull_request:
    branches: [main, Dev]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          architecture: "x64"
        env:
          FORCE_NODE_VERSION: "20"
          
      - name: Install dependencies
        run: yarn install
        
      - name: Install Playwright Browsers
        run: yarn playwright install --with-deps
        
      - name: Create .env.test from repo secret
        run: |
          echo "TEST_WALLET_SECRET_KEY=${TEST_WALLET_SECRET_KEY}" > .env.test
        env:
          TEST_WALLET_SECRET_KEY: ${{ secrets.TEST_WALLET_SECRET_KEY }}
          
      - name: Run Playwright tests
        run: yarn playwright test